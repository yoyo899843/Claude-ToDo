{% extends "base.html" %}

{% block title %}Claude 整合 — Claude Todo{% endblock %}

{% block content %}
  <div class="shell">
    <div class="cl-page">
      <div class="cl-card card">
        <div class="cl-top">
          <h1 class="cl-title">Claude 整合</h1>
          <div class="cl-token-group">
            <label class="cl-label" for="token-input">API Token</label>
            <div class="cl-token-wrap">
              <input id="token-input" class="cl-token-input" type="password"
                placeholder="貼上 token…" autocomplete="off" oninput="refreshPrompt()" />
              <button class="cl-eye" type="button" onclick="toggleTokenVis()" aria-label="顯示/隱藏 token">👁</button>
            </div>
            <a href="/profile" class="cl-profile-link">建立 Token →</a>
          </div>
        </div>
        <div class="cl-prompt-head">
          <span class="cl-section-label">System Prompt</span>
          <button class="ghost cl-copy-btn" id="copy-btn" onclick="copyPrompt()">複製</button>
        </div>
        <pre class="cl-prompt" id="prompt-text"></pre>
      </div>
    </div>
  </div>
{% endblock %}

{% block scripts %}
<script>
const BASE_URL = "{{ request.base_url }}".replace(/\/$/, "");

function buildPrompt(token) {
  const t = token || "[YOUR_TOKEN]";
  return `你是我的個人助理，負責幫我整理 Gmail 並管理 Todo 清單。

## API 設定
Base URL: ${BASE_URL}
所有 /api/v1/ 請求附上 header：
  Authorization: Bearer ${t}
  Content-Type: application/json

## Todo API

GET  /api/v1/todos               列出 todos（?completed=true/false、?q=關鍵字）
POST /api/v1/todos               建立 todo
PATCH /api/v1/todos/{id}         更新 todo（title、description、completed、deadline 皆選填）
DELETE /api/v1/todos/{id}        刪除 todo（回傳 204）

建立 / 更新 body 範例：
{
  "title": "任務標題",
  "description": "詳細說明或連結",
  "deadline": "2026-07-10T10:00:00Z"
}

## Gmail 整理原則

1. 先用 Gmail connector 取未讀清單（subject + from + date），不要一開始就讀內文
2. 看 subject 判斷類型再決定是否讀內文：
   - 促銷 / 廣告         → 直接封存，不建 Todo
   - 需行動（付款、簽署、確認、回覆）→ 讀信取得連結 → 建 Todo，description 放摘要和連結
   - 會議 / 活動         → 建 Todo，deadline 設為活動時間，description 放 Meet/Zoom 連結
   - 一般通知            → 標已讀 + 封存
3. 執行前先列出「打算怎麼處理」，等我確認後再動作
4. deadline 一律 UTC ISO 8601（例：2026-07-10T10:00:00Z）
5. 除非我明確要求，否則不刪除 Todo`;
}

function refreshPrompt() {
  document.getElementById("prompt-text").textContent =
    buildPrompt(document.getElementById("token-input").value.trim());
}

function toggleTokenVis() {
  const el = document.getElementById("token-input");
  el.type = el.type === "password" ? "text" : "password";
}

async function copyPrompt() {
  await navigator.clipboard.writeText(document.getElementById("prompt-text").textContent);
  const btn = document.getElementById("copy-btn");
  btn.textContent = "已複製！";
  setTimeout(() => { btn.textContent = "複製"; }, 2000);
}

refreshPrompt();
</script>
{% endblock %}
